{p.name}\"><img src=\"${previewAssets[p.pack ? 'pack' : 'bottle']}\" alt=\"رسم توضيحي تجريبي لـ ${p.name}\" width=\"360\" height=\"420\" loading=\"lazy\">${p.oldPrice ? `<span class=\"badge\">−${Math.round((1-p.price/p.oldPrice)*100)}٪<\/span>` : ''}<span class=\"art-caption\" lang=\"en\" dir=\"ltr\">${p.latin}<\/span><\/a><div class=\"product-info\"><p class=\"eyebrow\">${p.size}<\/p><h3><a href=\"#/product/${p.id}\">${p.name}<\/a><\/h3><p class=\"notes\">${p.notes}<\/p><div class=\"price-row\"><span>${money(p.price)} ${p.oldPrice ? `<del>${money(p.oldPrice)}<\/del>` : ''}<\/span><button class=\"quick-add\" data-add=\"${p.id}\" aria-label=\"أضف ${p.name} إلى السلة\">+<\/button><\/div><\/div><\/article>`;\n}\n\nfunction updateSEO(title, description, path, product) {\n  document.title = `${title} | ${config.brand}`;\n  document.querySelector('meta[name=\"description\"]').content = description;\n  document.querySelector('meta[property=\"og:title\"]').content = document.title;\n  document.querySelector('meta[property=\"og:description\"]').content = description;\n  document.querySelector('#schema')?.remove();\n  document.querySelector('link[rel=\"canonical\"]')?.remove();\n  // Hash views are prototype routes. Production must supply real server URLs.\n  if (!config.canonicalBase || config.mode === 'demo') return;\n  const url = new URL(path, config.canonicalBase).href;\n  const canonical = document.createElement('link'); canonical.rel='canonical'; canonical.href=url; document.head.append(canonical);\n  const script = document.createElement('script'); script.id='schema'; script.type='application/ld+json';\n  const breadcrumb = {'@type':'BreadcrumbList',itemListElement:[{'@type':'ListItem',position:1,name:'الصفحة الرئيسية',item:config.canonicalBase},{'@type':'ListItem',position:2,name:title,item:url}]};\n  script.textContent=JSON.stringify({'@context':'https://schema.org','@graph':[breadcrumb,...(product ? [{'@type':'Product',name:product.name,description,sku:product.id}] : [])]});\n  document.head.append(script);\n}\n\nconst main = document.querySelector('main');\nconst dialog = document.querySelector('#cart-dialog');\nlet cart = []; let routeVersion=0; let toastTimer;\ntry { const saved=JSON.parse(localStorage.getItem('muskane-demo-cart') || '[]'); if(Array.isArray(saved)) cart=saved.filter(i=>products.some(p=>p.id===i.id)&&Number.isInteger(i.quantity)&&i.quantity>0&&i.quantity<=20).slice(0,products.length).filter((i,n,a)=>a.findIndex(j=>j.id===i.id)===n); } catch { /* Storage may be unavailable. */ }\nconst grid = list => `<div class=\"product-grid\">${list.map(productCard).join('')}<\/div>`;\nconst heading = (kicker,title,link='') => `<div class=\"section-heading\"><div><p class=\"eyebrow\">${kicker}<\/p><h2>${title}<\/h2><\/div>${link ? `<a class=\"text-link\" href=\"${link}\">اكتشف المجموعة <span aria-hidden=\"true\">←<\/span><\/a>` : ''}<\/div>`;\nconst benefits = `<div class=\"benefits container\"><span>◇ <b>توصيل لجميع مدن المغرب<\/b><\/span><span>▱ <b>الدفع عند الاستلام<\/b><\/span><span>◌ <b>خدمة الزبناء<\/b><\/span><span>✧ <b>منتجات مختارة بعناية<\/b><\/span><\/div>`;\nconst faqs = [\n ['هل يتوفر التوصيل إلى مدينتي؟','نهدف إلى خدمة مدن المغرب. ستُحدّد مناطق التغطية ورسوم التوصيل في المتجر الفعلي قبل تأكيد الطلب.'],\n ['هل يمكنني الدفع عند الاستلام؟','الدفع عند الاستلام ضمن تجربة المتجر المخطط لها. تُؤكّد إتاحته وشروطه عند ربط الطلبات بـ YouCan.'],\n ['ما مدة التوصيل؟','تختلف المدة حسب المدينة وشركة التوصيل. ستُضاف المدد المعتمدة بعد تأكيدها من فريق مسكان.'],\n ['كيف أطلب عطري؟','اختر عطرك وحدد الكمية ثم أضفه إلى السلة. في النسخة الفعلية سيستكمل الطلب عبر صفحة الدفع الآمنة الخاصة بـ YouCan. هذه النسخة لا تستقبل الطلبات.'],\n ['ما هي باكات وتقسيمات العطور؟','هي مجموعة أحجام صغيرة لاكتشاف عدة روائح قبل اختيار الحجم الأكبر. أحجام 10 مل ومحتويات الباكات المعروضة هنا أمثلة تجريبية ويجب تأكيدها قبل البيع.'],\n];\nfunction home() {\n main.innerHTML=`<section class=\"hero\"><picture><source media=\"(max-width: 640px)\" srcset=\"$ row\">لماذا مسكان؟<\/p><h2>العطر تفصيل صغير.<br>لكنّه يقول الكثير.<\/h2><p>نصمّم تجربة تجعل اكتشاف العطور أبسط. من تصفّح المجموعات إلى فهم الروائح واختيار الحجم المناسب لذوقك.<\/p><a class=\"text-link\" href=\"#/contact\">تعرّف علينا <span aria-hidden=\"true\">←<\/span><\/a><\/div><div class=\"values\"><article><span>01<\/span><div><h3>اختيارات واضحة<\/h3><p>معلومات عن الحجم والنفحات تساعدك على المقارنة.<\/p><\/div><\/article><article><span>02<\/span><div><h3>مساحة للاكتشاف<\/h3><p>باكات وأحجام صغيرة لتجربة عطور مختلفة.<\/p><\/div><\/article><article><span>03<\/span><div><h3>تجربة قريبة منك<\/h3><p>متجر بالعربية وأسعار بالدرهم المغربي.<\/p><\/div><\/article><\/div><\/section>\n <section class=\"reviews soft-section\"><div class=\"container section\">${heading('تجاربكم تهمّنا','مساحة لآراء الزبناء')}<div class=\"review-placeholder\"><span class=\"quote-mark\" aria-hidden=\"true\">“<\/span><p>هنا ستجدون تجارب زبناء مسكان بعد جمعها والتحقّق منها.<\/p><span class=\"demo-label\">مكوّن معاينة — لا توجد مراجعات منشورة أو تقييمات مُختلقة.<\/span><\/div><\/div><\/section>\n <section class=\"faq section container\"><div><p class=\"eyebrow\">كل ما تحتاج معرفته<\/p><h2>أسئلة تتكرّر.<\/h2><p class=\"muted\">السياسات النهائية تُؤكّد قبل إطلاق المتجر.<\/p><\/div><div>${faqs.map(([q,a])=>`<details><summary>${q}<span aria-hidden=\"true\">+<\/span><\/summary><p>${a}<\/p><\/details>`).join('')}<\/div><\/section>`;\n updateSEO('عطر يشبهك','اكتشف عالم مسكان للعطور وباكات الاكتشاف. نموذج متجر مغربي بالعربية.','/');\n}\nfunction selectedProducts(id) { return products.filter(p=>id==='all'||(id==='packs'?p.pack:p.category===id)); }\nasync function collection(id, version) {\n const category=categories.find(c=>c.id===id);\n if(!category&&!['all','packs'].includes(id)) return notFound();\n const title=category?.name || (id==='packs'?'باكات الاكتشاف':'جميع العطور');\n main.innerHTML=`<div class=\"container section collection\"><p class=\"breadcrumbs\"><a href=\"#/\">الرئيسية<\/a> / ${title}<\/p><p class=\"eyebrow\">THE MUSKANE COLLECTION<\/p><h1>${title}<\/h1><p class=\"muted\">اختر تفاصيل عطرك القادم. جميع المنتجات هنا للتجربة فقط.<\/p><div class=\"collection-controls\"><label>التصفية <select id=\"filter\"><option value=\"all\">جميع الأسعار<\/option><option value=\"under\">أقل من 400 د.م<\/option><option value=\"over\">400 د.م فأكثر<\/option><\/select><\/label><label>الترتيب <select id=\"sort\"><option value=\"default\">الاختيار الافتراضي<\/option><option value=\"low\">السعر: من الأقل<\/option><option value=\"high\">السعر: من الأعلى<\/option><option value=\"name\">الاسم<\/option><\/select><\/label><span id=\"result-count\" role=\"status\"><\/span><\/div><div id=\"collection-results\" aria-busy=\"true\"><div class=\"product-grid\">${Array.from({length:4},()=>'<div class=\"skeleton\" aria-hidden=\"true\"><\/div>').join('')}<\/div><p role=\"status\">جارٍ عرض المجموعة…<\/p><\/div><\/div>`;\n updateSEO(title,`اكتشف ${title} من مسكان — مجموعة تجريبية.`,`/collections/${id}`);\n const refresh=()=>{\n  let list=selectedProducts(id); const filter=document.querySelector('#filter').value;\n  list=list.filter(p=>filter==='all'||(filter==='under'?p.price<400:p.price>=400));\n  const sort=document.querySelector('#sort').value;\n  if(sort==='low') list.sort((a,b)=>a.price-b.price); if(sort==='high') list.sort((a,b)=>b.price-a.price); if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ar'));\n  document.querySelector('#result-count').textContent=`${list.length} منتجات تجريبية`;\n  const target=document.querySelector('#collection-results');target.setAttribute('aria-busy','false');target.innerHTML=list.length?grid(list):'<div class=\"empty\"><h2>لا توجد منتجات ضمن هذا الاختيار<\/h2><p>جرّب تغيير تصفية السعر.<\/p><button class=\"button\" id=\"reset-filter\">إعادة ضبط التصفية<\/button><\/div>';\n  document.querySelector('#reset-filter')?.addEventListener('click',()=>{document.querySelector('#filter').value='all';refresh();});\n };\n document.querySelector('#filter').addEventListener('change',refresh);document.querySelector('#sort').addEventListener('change',refresh);\n await new Promise(resolve=>setTimeout(resolve,180)); if(version===routeVersion) refresh();\n}\nfunction product(id) {\n const p=products.find(p=>p.id===id); if(!p) return notFound();\n main.innerHTML=`<section class=\"container section\"><p class=\"breadcrumbs\"><a href=\"#/\">الرئيسية<\/a> / <a href=\"#/collection/${p.category}\">${categories.find(c=>c.id===p.category).name}<\/a> / ${p.name}<\/p><div class=\"product-detail\"><div><div class=\"gallery ${p.tone}\"><img id=\"gallery-image\" src=\"${previewAssets[p.pack?'pack':'bottle']}\" alt=\"رسم توضيحي تجريبي لـ ${p.name} — الواجهة\" width=\"540\" height=\"600\"><\/div><div class=\"thumbnails\" aria-label=\"صور المنتج\"><button class=\"thumbnail active\" data-view=\"front\" aria-label=\"عرض الواجهة\" aria-pressed=\"true\"><img src=\"${previewAssets[p.pack?'pack':'bottle']}\" alt=\"\" width=\"70\" height=\"80\"><\/button><button class=\"thumbnail\" data-view=\"detail\" aria-label=\"عرض تفاصيل العبوة\" aria-pressed=\"false\"><img src=\"${previewAssets[p.pack?'pack':'bottle']}\" alt=\"\" width=\"70\" height=\"80\"><\/button><span class=\"muted\">صور توضيحية — تُستبدل بصور المنتج.<\/span><\/div><\/div><div class=\"product-copy\"><p class=\"eyebrow\" lang=\"en\">${p.latin}<\/p><h1>${p.name}<\/h1><p class=\"product-notes\">${p.notes}<\/p><p class=\"detail-price\">${money(p.price)} ${p.oldPrice?`<del>${money(p.oldPrice)}<\/del>`:''}<\/p><p>${p.pack?'باك تجريبي يجمع ثلاث تقسيمات بحجم 10 مل لاكتشاف روائح مختلفة.':'تركيبة عطرية تجريبية بطابع متوازن، لاكتشاف أسلوبك الشخصي.'} وصف النفحات والحجم والسعر بيانات توضيحية وليست عرضاً تجارياً.<\/p><span class=\"size-label\">${p.size}<\/span><form id=\"purchase-form\"><label for=\"quantity\">الكمية<\/label><div class=\"purchase-row\"><div class=\"quantity-control\"><button type=\"button\" data-step=\"-1\" aria-label=\"تقليل الكمية\">−<\/button><input id=\"quantity\" name=\"quantity\" type=\"number\" min=\"1\" max=\"20\" value=\"1\" inputmode=\"numeric\" required><button type=\"button\" data-step=\"1\" aria-label=\"زيادة الكمية\">+<\/button><\/div><button class=\"button\" type=\"submit\">أضف إلى السلة <span aria-hidden=\"true\">+<\/span><\/button><\/div><\/form><p class=\"demo-label\">نسخة تجريبية — لا يمكن إتمام شراء حقيقي.<\/p><div class=\"product-benefits\"><p>◇ توصيل لجميع مدن المغرب — التغطية تُؤكّد لاحقاً<\/p><p>▱ الدفع عند الاستلام — وفق شروط المتجر النهائية<\/p><p>✧ التوصيل بالمجان ابتداءً من 500 د.م<\/p><\/div><details><summary>تفاصيل المنتج <span aria-hidden=\"true\">+<\/span><\/summary><p>الحجم: ${p.size}. النفحات: ${p.notes}. تُضاف المكونات وتعليمات الاستخدام والتنبيهات بعد توفير بيانات المنتج المعتمدة.<\/p><\/details><\/div><\/div><\/section><section class=\"section container\">${heading('اكتشف أيضاً','قد يناسب ذوقك')}${grid(products.filter(x=>x.id!==p.id&&(x.category===p.category||x.pack===p.pack)).slice(0,4))}<\/section><div class=\"mobile-purchase\"><span>${p.name}<b>${money(p.price)}<\/b><\/span><button class=\"button\" id=\"sticky-add\">أضف إلى السلة<\/button><\/div>`;\n const quantity=document.querySelector('#quantity');\n document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{quantity.value=Math.max(1,Math.min(20,(Number(quantity.value)||1)+Number(b.dataset.step)));}));\n document.querySelector('#purchase-form').addEventListener('submit',e=>{e.preventDefault();add(p.id,Number(quantity.value));});\n document.querySelector('#sticky-add').addEventListener('click',()=>{if(quantity.reportValidity())add(p.id,Number(quantity.value));});\n document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const detail=b.dataset.view==='detail';document.querySelector('#gallery-image').classList.toggle('zoom',detail);document.querySelector('#gallery-image').alt=`رسم توضيحي تجريبي لـ ${p.name} — ${detail?'تفاصيل العبوة':'الواجهة'}`;document.querySelectorAll('[data-view]').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-pressed',String(t===b));});}));\n updateSEO(p.name,`${p.name} — ${p.notes}. منتج توضيحي من مسكان.`,`/products/${p.id}`,p);\n}\nfunction search() {\n main.innerHTML=`<section class=\"section container search-page\"><p class=\"eyebrow\">اكتشف ما يشبهك<\/p><h1>عن أي عطر تبحث؟<\/h1><form id=\"search-form\" role=\"search\"><label class=\"sr-only\" for=\"search-input\">اسم العطر أو نفحاته<\/label><input id=\"search-input\" type=\"search\" placeholder=\"اسم العطر، مسك، عنبر…\" autocomplete=\"off\" maxlength=\"100\"><button class=\"button\">ابحث<\/button><\/form><p id=\"search-count\" role=\"status\" aria-live=\"polite\">اكتب اسم العطر أو نفحاته لاكتشاف النتائج.<\/p><div id=\"search-results\"><\/div><\/section>`;\n function refresh(){const q=document.querySelector('#search-input').value.trim().toLocaleLowerCase('ar');const list=products.filter(p=>`${p.name} ${p.latin} ${p.notes}`.toLocaleLowerCase('ar').includes(q));document.querySelector('#search-count').textContent=q?`${list.length} نتائج للبحث عن «${q}»`:'جميع المنتجات التجريبية';document.querySelector('#search-results').innerHTML=list.length?grid(list):'<div class=\"empty\"><h2>لم نعثر على عطر بهذا الاسم<\/h2><p>جرّب نفحة أخرى مثل المسك أو الورد.<\/p><a class=\"text-link\" href=\"#/collection/all\">تصفّح المجموعة ←<\/a><\/div>';}\n document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();refresh();});document.querySelector('#search-input').addEventListener('input',refresh);updateSEO('البحث','ابحث في مجموعة مسكان التجريبية.','/search');\n}\nfunction infoPage(type) {\n const pages={shipping:['التوصيل والدفع','تُحدّد رسوم التوصيل والمناطق المغطاة والمدد وشروط الدفع عند الاستلام بعد مراجعة فريق مسكان. رسالة العرض المخطط لها: التوصيل بالمجان لمشتريات بقيمة 500 درهم أو أكثر. لا تُعتمد هذه الصفحة كسياسة نهائية.'],returns:['الاستبدال والإرجاع','تُضاف شروط الإرجاع والاستبدال والآجال والمنتجات المستثناة بعد اعتماد سياسة المتجر ومراجعتها. لا توجد سياسة تجارية نافذة في هذا النموذج.'],privacy:['سياسة الخصوصية','هذه النسخة لا تتضمن أدوات تتبّع أو نماذج ترسل بيانات شخصية. تُحفظ عناصر السلة التجريبية في التخزين المحلي لهذا المتصفح، ويمكن حذفها بإفراغ السلة أو مسح بيانات الموقع. تُضاف سياسة المتجر النهائية قبل ربط YouCan وأدواته.']};\n const [title,copy]=pages[type]||[];if(!title)return notFound();main.innerHTML=`<section class=\"section container prose\"><p class=\"eyebrow\">معلومات المتجر<\/p><h1>${title}<\/h1><p class=\"demo-note\">صفحة توضيحية — تتطلب محتوى معتمداً قبل الإطلاق.<\/p><p>${copy}<\/p><a class=\"text-link\" href=\"#/contact\">اتصل بنا ←<\/a><\/section>`;updateSEO(title,copy,`/policies/${type}`);\n}\nfunction contact(){main.innerHTML=`<section class=\"section container prose\"><p class=\"eyebrow\">MUSKANE PARFUM<\/p><h1>يسعدنا تواصلك.<\/h1><p>للمساعدة في اختيار عطر أو للاستفسار عن طلبك، ستجد هنا قنوات التواصل الرسمية عند تفعيل المتجر.<\/p><div id=\"contact-channels\"><\/div><p class=\"demo-note\">لم تُزوّد النسخة التجريبية برقم هاتف أو حسابات اجتماعية. لا تستقبل هذه الصفحة رسائل أو طلبات.<\/p><a class=\"button\" href=\"#/collection/all\">اكتشف المجموعة ←<\/a><\/section>`;const target=document.querySelector('#contact-channels');if(config.contactEmail&&/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(config.contactEmail)){const a=document.createElement('a');a.href=`mailto:${config.contactEmail}`;a.textContent=config.contactEmail;target.append(a);}updateSEO('اتصل بنا','قنوات التواصل الرسمية لمسكان — تُضاف بعد تأكيدها.','/contact');}\nfunction notFound(){main.innerHTML='<section class=\"section container empty\"><h1>الصفحة غير موجودة<\/h1><p>يمكنك العودة لاكتشاف مجموعة مسكان.<\/p><a class=\"button\" href=\"#/\">الصفحة الرئيسية<\/a><\/section>';updateSEO('الصفحة غير موجودة','العودة إلى متجر مسكان.','/404');}\nfunction route(){const version=++routeVersion;const path=location.hash.slice(1)||'/';const parts=path.split('/').filter(Boolean);document.body.classList.toggle('is-product',parts[0]==='product');document.querySelector('#mobile-nav').hidden=true;document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');if(!parts.length)home();else if(parts[0]==='collection')collection(parts[1],version);else if(parts[0]==='product')product(parts[1]);else if(parts[0]==='search')search();else if(parts[0]==='policy')infoPage(parts[1]);else if(parts[0]==='contact')contact();else notFound();document.querySelectorAll('.desktop-nav a').forEach(a=>{if(a.hash===location.hash||(!location.hash&&a.hash==='#/'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});window.scrollTo({top:0,behavior:'instant'});if(version>1)main.focus({preventScroll:true});}\nfunction toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3000);}\nfunction save(){try{localStorage.setItem('muskane-demo-cart',JSON.stringify(cart));}catch{/* Memory cart remains usable. */}document.querySelector('#cart-count').textContent=cart.reduce((sum,i)=>sum+i.quantity,0);}\nasync function add(id,quantity=1){if(!products.some(p=>p.id===id)||!Number.isInteger(quantity)||quantity<1||quantity>20)return;cart=await commerce.addItem(id,quantity,cart);save();toast('تمت الإضافة إلى السلة التجريبية');if(dialog.open)renderCart();}\nfunction renderCart(){const subtotal=cart.reduce((sum,i)=>sum+products.find(p=>p.id===i.id).price*i.quantity,0);document.querySelector('#cart-items').innerHTML=cart.length?cart.map(i=>{const p=products.find(p=>p.id===i.id);return `<article class=\"cart-item\"><a href=\"#/product/${p.id}\" class=\"${p.tone}\"><img src=\"${previewAssets[p.pack?'pack':'bottle']}\" alt=\"${p.name} — رسم توضيحي\" width=\"80\" height=\"96\"><\/a><div><h3>${p.name}<\/h3><p>${money(p.price)}<\/p><div class=\"cart-quantity\"><button data-cart-step=\"-1\" data-id=\"${p.id}\" aria-label=\"تقليل كمية ${p.name}\" ${i.quantity===1?'disabled':''}>−<\/button><span>${i.quantity}<\/span><button data-cart-step=\"1\" data-id=\"${p.id}\" aria-label=\"زيادة كمية ${p.name}\" ${i.quantity===20?'disabled':''}>+<\/button><button data-remove=\"${p.id}\">حذف<\/button><\/div><\/div><\/article>`;}).join(''):'<div class=\"empty\"><h3>سلتك تنتظر اكتشافاتك<\/h3><p>ابدأ باختيار عطر من المجموعة.<\/p><a href=\"#/collection/all\" class=\"text-link\">تصفّح العطور ←<\/a><\/div>';document.querySelector('#cart-summary').innerHTML=cart.length?`<div class=\"subtotal\"><span>المجموع الفرعي<\/span><b>${money(subtotal)}<\/b><\/div><p class=\"muted\">${subtotal>=config.freeShippingThreshold?'بلغت قيمة التوصيل المجاني في المثال التجريبي.':`متبقّي ${money(config.freeShippingThreshold-subtotal)} للوصول إلى قيمة التوصيل المجاني.`}<\/p><button class=\"button full\" disabled>الدفع عبر YouCan — غير مربوط بعد<\/button><p class=\"demo-label\">لا يمكن الدفع أو إرسال طلب في هذا النموذج.<\/p><button class=\"text-link\" id=\"clear-cart\">إفراغ السلة<\/button>`:'';document.querySelector('#clear-cart')?.addEventListener('click',()=>{cart=[];save();renderCart();document.querySelector('#close-cart').focus();});}\ndocument.addEventListener('click',e=>{const addButton=e.target.closest('[data-add]');if(addButton)add(addButton.dataset.add);const remove=e.target.closest('[data-remove]');if(remove){cart=cart.filter(i=>i.id!==remove.dataset.remove);save();renderCart();(document.querySelector('[data-remove]')||document.querySelector('#close-cart')).focus();}const step=e.target.closest('[data-cart-step]');if(step){const item=cart.find(i=>i.id===step.dataset.id);if(item)item.quantity=Math.max(1,Math.min(20,item.quantity+Number(step.dataset.cartStep)));save();renderCart();const replacement=[...document.querySelectorAll('[data-cart-step]')].find(b=>b.dataset.id===step.dataset.id&&b.dataset.cartStep===step.dataset.cartStep);if(replacement&&!replacement.disabled)replacement.focus();else document.querySelector('#close-cart').focus();}if(dialog.open&&e.target.closest('a[href^=\"#/\"]'))dialog.close();});\ndocument.querySelector('.cart-toggle').addEventListener('click',()=>{renderCart();dialog.showModal();});document.querySelector('#close-cart').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});\ndocument.querySelector('.menu-toggle').addEventListener('click',e=>{const nav=document.querySelector('#mobile-nav');nav.hidden=!nav.hidden;e.currentTarget.setAttribute('aria-expanded',String(!nav.hidden));});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('#mobile-nav').hidden=true;document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');}});\nif(/^\\d{8,15}$/.test(config.whatsappNumber)){const a=document.createElement('a');a.href=`https://wa.me/${config.whatsappNumber}`;a.className='whatsapp';a.textContent='واتساب';a.setAttribute('aria-label','تواصل معنا عبر واتساب');a.rel='noopener noreferrer';a.target='_blank';document.body.append(a);}\nfor(const social of config.socialLinks){try{const url=new URL(social.url);if(url.protocol!=='https:')continue;const a=document.createElement('a');a.href=url.href;a.textContent=social.label;a.rel='noopener noreferrer';document.querySelector('#social-links').append(a);}catch{/* Ignore invalid configured links. */}}\ndocument.querySelector('#year').textContent=new Date().getFullYear();window.addEventListener('hashchange',route);save();route();\n\n<\/script><\/body><\/html>\n";document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.classList.toggle('mobile',b.dataset.mode==='mobile');document.querySelectorAll('button').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));});</script></html>

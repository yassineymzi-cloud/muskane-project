ue\">+\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/article>`;\n}\n\nreturn {money,productCard};\n})();\npreviewModules[\"src/adapters/youcan.js\"] = (() => {\n// Only demo behavior is implemented. Replace these boundaries with verified\n// YouCan theme APIs; never insert private API credentials in browser code.\nconst commerce = {\n  async addItem(id, quantity, cart) {\n    const next = cart.map(item => ({...item}));\n    const existing = next.find(item => item.id === id);\n    if (existing) existing.quantity = Math.min(20, existing.quantity + quantity);\n    else next.push({id, quantity: Math.min(20, quantity)});\n    return next;\n  },\n  async checkout() { throw new Error('الدفع غير متاح في النسخة التجريبية. سيتم ربطه بـ YouCan.'); },\n};\n\nreturn {commerce};\n})();\npreviewModules[\"src/seo.js\"] = (() => {\nconst {config} = previewModules[\"src/config.js\"];\nfunction updateSEO(title, description, path, product) {\n  document.title = `${title} | ${config.brand}`;\n  document.querySelector('meta[name=\"description\"]').content = description;\n  document.querySelector('meta[property=\"og:title\"]').content = document.title;\n  document.querySelector('meta[property=\"og:description\"]').content = description;\n  document.querySelector('#schema')?.remove();\n  document.querySelector('link[rel=\"canonical\"]')?.remove();\n  // Hash views are prototype routes. Production must supply real server URLs.\n  if (!config.canonicalBase || config.mode === 'demo') return;\n  const url = new URL(path, config.canonicalBase).href;\n  const canonical = document.createElement('link'); canonical.rel='canonical'; canonical.href=url; document.head.append(canonical);\n  const script = document.createElement('script'); script.id='schema'; script.type='application/ld+json';\n  const breadcrumb = {'@type':'BreadcrumbList',itemListElement:[{'@type':'ListItem',position:1,name:'الصفحة الرئيسية',item:config.canonicalBase},{'@type':'ListItem',position:2,name:title,item:url}]};\n  sc  التوصيل في المتجر الفعلي قبل تأكيد الطلب.'],\n ['هل يمكنني الدفع عند الاستلام؟','الدفع عند الاستلام ضمن تجربة المتجر المخطط لها. تُؤكّد إتاحته وشروطه عند ربط الطلبات بـ YouCan.'],\n ['ما مدة التوصيل؟','تختلف المدة حسب المدينة وشركة التوصيل. ستُضاف المدد المعتمدة بعد تأكيدها من فريق مسكان.'],\n ['كيف أطلب عطري؟','اختر عطرك وحدد الكمية ثم أضفه إلى السلة. في النسخة الفعلية سيستكمل الطلب عبر صفحة الدفع الآمنة الخاصة بـ YouCan. هذه النسخة لا تستقبل الطلبات.'],\n ['ما هي باكات وتقسيمات العطور؟','هي مجموعة أحجام صغيرة لاكتشاف عدة روائح قبل اختيار الحجم الأكبر. أحجام 10 مل ومحتويات الباكات المعروضة هنا أمثلة تجريبية ويجب تأكيدها قبل البيع.'],\n];\nfunction collectionShowcase(id, kicker, title) {\n const category=categories.find(c=>c.id===id);\n return `\u003csection class=\"section container\">${heading(kicker,title,`#/collection/${id}`)}\u003cdiv class=\"collection-showcase\">\u003cdiv class=\"collection-story ${category.tone}\">\u003cp class=\"eyebrow\" lang=\"en\" dir=\"ltr\">${category.english}\u003c/p>\u003ch3>${category.note}\u003c/h3>\u003cp>${category.description}\u003c/p>\u003ca class=\"text-link\" href=\"#/collection/${id}\">تصفح المجموعة \u003cspan aria-hidden=\"true\">←\u003c/span>\u003c/a>\u003cspan class=\"story-mark\" aria-hidden=\"true\">M.\u003c/span>\u003c/div>${grid(products.filter(p=>p.category===id))}\u003c/div>\u003c/section>`;\n}\nconst mobileHomeLayout = window.matchMedia('(max-width: 640px)');\nfunction arrangeHomeSections() {\n const categoriesSection = main.querySelector('.home-categories');\n const featuredSection = main.querySelector('.featured-section');\n if (!categoriesSection || !featuredSection) return;\n if (mobileHomeLayout.matches) categoriesSection.before(featuredSection);\n else categoriesSection.after(featuredSection);\n}\nmobileHomeLayout.addEventListener('change', arrangeHomeSections);\nfunction home() {\n main.innerHTML=`\n \u003csection class=\"hero\">\u003cpicture>\u003csource media=\"(max-width: 640px)\" srcset=\"${config.heroMobile}\">\u003cimg src=\"${config.heroDesktop}\" width=\"1440\" height=\"720\" alt=\"رسم فني توضيحي لقارورة عطر على قاعدة حجرية بلون عاجي\" fetchpriority=\"high\">\u003c/picture>\n   \u003cdiv class=\"hero-content\">\u003cp class=\"eyebrow\" lang=\"en\" dir=\"ltr\">A PERSONAL EXPRESSION\u003c/p>\u003ch1>لكل ذوق، عطر.\u003cbr>ولكل عطر، حكاية.\u003c/h1>\u003cp>بين نفحة تحبّها وتجربة جديدة،\u003cbr>خذ وقتك لاكتشاف ما يشبهك.\u003c/p>\u003cdiv class=\"hero-actions\">\u003ca class=\"button\" href=\"#/collection/all\">اكتشف المجموعة \u003cspan aria-hidden=\"true\">←\u003c/span>\u003c/a>\u003ca class=\"hero-secondary\" href=\"#/collection/packs\">باكات التجربة\u003c/a>\u003c/div>\u003cspan class=\"hero-footnote\">MUSKANE PARFUM · MOROCCO\u003c/span>\u003c/div>\n   \u003cspan class=\"hero-index\" dir=\"ltr\">01 — THE FRAGRANCE EDIT\u003c/span>\u003cspan class=\"hero-art-note\">رسم توضيحي للمعاينة\u003c/span>\n \u003c/section>\n ${benefits}\n \u003csection class=\"section container home-categories\">${heading('أربع مجموعات، مساحة للاختيار','اكتشف عالم مسكان')}\u003cdiv class=\"category-grid\">${categories.map((c,i)=>`\u003ca class=\"category-card ${c.tone}\" href=\"#/collection/${c.id}\">\u003cspan class=\"category-number\" dir=\"ltr\">0${i+1} / ${c.english}\u003c/span>\u003cimg src=\"${previewAsset(`./assets/${c.id.includes('packs')?'pack':'bottle'}.svg`)}\" alt=\"تصميم توضيحي لفئة ${c.name}\" width=\"360\" height=\"420\" loading=\"lazy\">\u003cdiv>\u003cp>${c.note}\u003c/p>\u003ch3>${c.name} \u003cspan aria-hidden=\"true\">←\u003c/span>\u003c/h3>\u003c/div>\u003c/a>`).join('')}\u003c/div>\u003c/section>\n \u003csection class=\"section container featured-section\">${heading('اختيارات للمعاينة','روائح تستحق الاكتشاف','#/collection/all')}\u003cp class=\"section-note\">الأسماء والنفحات والصور والأسعار أمثلة توضيحية، وليست بيانات منتجات مسكان الفعلية.\u003c/p>${grid(products.filter(p=>p.featured))}\u003c/section>\n \u003csection class=\"discovery\">\u003cdiv class=\"container di \u003ch3>أحجام مناسبة للتجربة\u003c/h3>\u003cp>تقسيمات وباكات صغيرة لاكتشاف أكثر من طابع عطري.\u003c/p>\u003c/div>\u003c/article>\u003carticle>\u003cspan>03\u003c/span>\u003cdiv>\u003ch3>تجربة تصفّح بسيطة\u003c/h3>\u003cp>مجموعات واضحة، بحث بالعربية، وأسعار بالدرهم المغربي.\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003c/section>\n \u003csection class=\"reviews soft-section\">\u003cdiv class=\"container section\">${heading('مكان لتجاربكم الحقيقية','حكايات تُروى بالعطر')}\u003cdiv class=\"review-placeholder\">\u003cdiv class=\"review-emblem\" aria-hidden=\"true\">“\u003c/div>\u003cdiv>\u003cspan class=\"demo-tag\">مساحة توضيحية للمراجعات\u003c/span>\u003cp>لكل تجربة حكاية.\u003cbr>سنترك هنا مساحة لتجارب زبنائنا.\u003c/p>\u003cspan class=\"demo-label\">تُضاف المراجعات بعد جمعها والتحقّق منها. لا توجد تقييمات أو أعداد مراجعات مُختلقة.\u003c/span>\u003c/div>\u003cspan class=\"review-signature\" lang=\"en\" dir=\"ltr\">MUSKANE\u003cbr>PARFUM\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n \u003csection class=\"faq section container\">\u003cdiv>\u003cp class=\"eyebrow\">قبل أن تختار\u003c/p>\u003ch2>أسئلة تتكرّر.\u003c/h2>\u003cp class=\"muted\">تفاصيل التوصيل والدفع والسياسات تُعتمد قبل الإطلاق.\u003c/p>\u003ca class=\"text-link\" href=\"#/contact\">تواصل معنا \u003cspan aria-hidden=\"true\">←\u003c/span>\u003c/a>\u003c/div>\u003cdiv>${faqs.map(([q,a])=>`\u003cdetails>\u003csummary>${q}\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>${a}\u003c/p>\u003c/details>`).join('')}\u003c/div>\u003c/section>`;\n arrangeHomeSections();\n updateSEO('لكل ذوق، عطر','اكتشف مجموعات مسكان وباكات التجربة. نموذج متجر مغربي بالعربية مع بيانات توضيحية.','/');\n}\nfunction selectedProducts(id) { return products.filter(p=>id==='all'||(id==='packs'?p.pack:p.category===id)); }\nasync function collection(id, version) {\n const category=categories.find(c=>c.id===id);\n if(!category&&!['all','packs'].includes(id)) return notFound();\n const title=category?.name || (id==='packs'?'باكات الاكتشاف':'جميع العطور');\n const isPack=id==='packs'||id.endsWith('-packs');\n const intro=category?.description||(isPack?'أربعة عطور بحجم 10 مل لكل عطر، في تصوّر لباك يفتح لك مساحة للتجربة والمقارنة.':'تصفّح أمثلة من العطور وباكات التجربة، واختر المجموعة الأقرب إلى ذوقك.');\n main.innerHTML=`\u003cdiv class=\"container section collection\">\u003cp class=\"breadcrumbs\">\u003ca href=\"#/\">الرئيسية\u003c/a> / ${title}\u003c/p>\u003cdiv class=\"collection-intro ${category?.tone||'amber'}\">\u003cdiv>\u003cp class=\"eyebrow\" lang=\"en\" dir=\"ltr\">${category?.english||(isPack?'THE DISCOVERY EDIT':'THE FRAGRANCE EDIT')}\u003c/p>\u003ch1>${title}\u003c/h1>\u003cp>${intro}\u003c/p>\u003cspan class=\"demo-tag\">مجموعة للمعاينة · بيانات توضيحية\u003c/span>${isPack?'\u003cspan class=\"collection-size\" dir=\"ltr\">4 × 10 ml\u003c/span>':''}\u003c/div>\u003cimg src=\"${previewAsset(`./assets/${isPack?'pack':'bottle'}.svg`)}\" alt=\"رسم توضيحي لـ ${title}\" width=\"360\" height=\"420\">\u003c/div>\u003cnav class=\"collection-tabs\" aria-label=\"مجموعات العطور\">\u003ca href=\"#/collection/all\" ${id==='all'?'aria-current=\"page\"':''}>جميع العطور\u003c/a>${categories.map(c=>`\u003ca href=\"#/collection/${c.id}\" ${id===c.id?'aria-current=\"page\"':''}>${c.name}\u003c/a>`).join('')}\u003c/nav>\u003cdiv class=\"collection-controls\">\u003clabel>التصفية حسب السعر \u003cselect id=\"filter\">\u003coption value=\"all\">جميع الأسعار\u003c/option>\u003coption value=\"under\">أقل من 400 DH\u003c/option>\u003coption value=\"over\">400 DH فأكثر\u003c/option>\u003c/select>\u003c/label>\u003clabel>الترتيب \u003cselect id=\"sort\">\u003coption value=\"default\">الاختيار الافتراضي\u003c/option>\u003coption value=\"low\">السعر: من الأقل\u003c/option>\u003coption value=\"high\">السعر: من الأعلى\u003c/option>\u003coption value=\"name\">الاسم\u003c/option>\u003c/select>\u003c/label>\u003cspan id=\"result-count\" role=\"status\">\u003c/span>\u003c/div>\u003cdiv id=\"collection-results\" aria-busy=\"true\">\u003cdiv class=\"product-grid\">${Array.from({length:4},()=>'\u003cdiv class=\"skeleton\" aria-hidden=\"true\">\u003c/div>').join('')}\u003c/div>\u003cp role=\"status\">جارٍ عرض المجموعة…\u003c/p>\u003c/div>\u003c/div>`;\n updateSEO(title,`اكتشف ${title} من مسكان — مجموعة تجريبية.`,`/collections/${id}`);\n const refresh=()=>{\n  let list=selectedProducts(id); const filter=document.querySelector('#filter').value;\n  list=list.filter(p=>filter==='all'||(filter==='under'?p.price\u003c400:p.price>=400));\n  const sort=document.querySelector('#sort').value;\n  if(sort==='low') list.sort((a,b)=>a.price-b.price); if(sort==='high') list.sort((a,b)=>b.price-a.price); if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ar'));\n  document.querySelector('#result-count').textContent=`${list.length} منتجات تجريبية`;\n  const target=document.querySelector('#collection-results');target.setAttribute('aria-busy','false');target.innerHTML=list.length?grid(list):'\u003cdiv class=\"empty\">\u003ch2>لا توجد منتجات ضمن هذا الاختيار\u003c/h2>\u003cp>جرّب تغيير تصفية السعر.\u003c/p>\u003cbutton class=\"button\" id=\"reset-filter\">إعادة ضبط التصفية\u003c/button>\u003c/div>';\n  document.querySelector('#reset-filter')?.addEventListener('click',()=>{document.querySelector('#filter').value='all';refresh();});\n };\n document.querySelector('#filter').addEventListener('change',refresh);document.querySelector('#sort').addEventListener('change',refresh);\n await new Promise(resolve=>setTimeout(resolve,180)); if(version===routeVersion) refresh();\n}\nfunction product(id) {\n const p=products.find(p=>p.id===id); if(!p) return notFound();\n main.innerHTML=`\u003csection class=\"container section\">\u003cp class=\"breadcrumbs\">\u003ca href=\"#/\">الرئيسية\u003c/a> / \u003ca href=\"#/collection/${p.category}\">${categories.find(c=>c.id===p.category).name}\u003c/a> / ${p.name}\u003c/p>\u003cdiv class=\"product-detail\">\u003cdiv>\u003cdiv class=\"gallery ${p.tone}\">\u003cimg id=\"gallery-image\" src=\"${previewAsset(`./assets/${p.pack?'pack':'bottle'}.svg`)}\" alt=\"رسم توضيحي تجريبي لـ ${p.name} — الواجهة\" width=\"540\" height=\"600\">\u003c/div>\u003cdiv class=\"thumbnails\" aria-label=\"صور المنتج\">\u003cbutton class=\"thumbnail active\" data-view=\"front\" aria-label=\"عرض الواجهة\" aria-pressed=\"true\">\u003cimg src=\"${previewAsset(`./assets/${p.pack?'pack':'bottle'}.svg`)}\" alt=\"\" width=\"70\" height=\"80\">\u003c/button>\u003cbutton class=\"thumbnail\" data-view=\"detail\" aria-label=\"عرض تفاصيل العبوة\" aria-pressed=\"false\">\u003cimg src=\"${previewAsset(`./assets/${p.pack?'pack':'bottle'}.svg`)}\" alt=\"\" width=\"70\" height=\"80\">\u003c/button>\u003cspan class=\"muted\">صور توضيحية — تُستبدل بصور المنتج.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"product-copy\">\u003cp class=\"eyebrow\" lang=\"en\" dir=\"ltr\">${p.latin}\u003c/p>\u003cspan class=\"demo-tag\">منتج توضيحي · ليس عرضاً تجارياً\u003c/span>\u003ch1>${p.name}\u003c/h1>\u003cp class=\"product-notes\">${p.notes}\u003c/p>\u003cp class=\"detail-price\">\u003cbdi dir=\"ltr\">${money(p.price)}\u003c/bdi> ${p.oldPrice?`\u003cdel>\u003cbdi dir=\"ltr\">${money(p.oldPrice)}\u003c/bdi>\u003c/del>`:''}\u003c/p>\u003cp>${p.pack?'باك توضيحي يجمع أربع تقسيمات بحجم 10 مل لاكتشاف روائح مختلفة.':'تركيبة عطرية تجريبية بطابع متوازن، لاكتشاف أسلوبك الشخصي.'} وصف النفحات والحجم والسعر بيانات توضيحية وليست عرضاً تجارياً.\u003c/p>\u003cspan class=\"size-label\">${p.size}\u003c/span>\u003cform id=\"purchase-form\">\u003clabel for=\"quantity\">الكمية\u003c/label>\u003cdiv class=\"purchase-row\">\u003cdiv class=\"quantity-control\">\u003cbutton type=\"button\" data-step=\"-1\" aria-label=\"تقليل الكمية\">−\u003c/button>\u003cinput id=\"quantity\" name=\"quantity\" type=\"number\" min=\"1\" max=\"20\" value=\"1\" inputmode=\"numeric\" required>\u003cbutton type=\"button\" data-step=\"1\" aria-label=\"زيادة الكمية\">+\u003c/button>\u003c/div>\u003cbutton class=\"button\" type=\"submit\">أضف إلى السلة \u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/button>\u003c/div>\u003c/form>\u003cp class=\"demo-label\">نسخة تجريبية — لا يمكن إتمام شراء حقيقي.\u003c/p>\u003cdiv class=\"product-benefits\">\u003cp>◇ معلومات واضحة عن الحجم والنفحات\u003c/p>\u003cp>◌ باكات وأحجام مناسبة للاكتشاف\u003c/p>\u003cp>▱ شروط التوصيل والدفع تُؤكّد قبل الإطلاق\u003c/p>\u003c/div>\u003cdetails>\u003csummary>تفاصيل المنتج \u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>الحجم: ${p.size}. النفحات: ${p.notes}. تُضاف المكونات وتعليمات الاستخدام والتنبيهات بعد توفير بيانات المنتج المعتمدة.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section container\">${heading('اكتشف أيضاً','قد يناسب ذوقك')}${grid(products.filter(x=>x.id!==p.id&&(x.category===p.category||x.pack===p.pack)).slice(0,4))}\u003c/section>\u003cdiv class=\"mobile-purchase\">\u003cspan>${p.name}\u003cb>\u003cbdi dir=\"ltr\">${money(p.price)}\u003c/bdi>\u003c/b>\u003c/span>\u003cbutton class=\"button\" id=\"sticky-add\">أضف إلى السلة\u003c/button>\u003c/div>`;\n const quantity=document.querySelector('#quantity');\n document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{quantity.value=Math.max(1,Math.min(20,(Number(quantity.value)||1)+Number(b.dataset.step)));}));\n document.querySelector('#purchase-form').addEventListener('submit',e=>{e.preventDefault();add(p.id,Number(quantity.value));});\n document.querySelector('#sticky-add').addEventListener('click',()=>{if(quantity.reportValidity())add(p.id,Number(quantity.value));});\n document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const detail=b.dataset.view==='detail';document.querySelector('#gallery-image').classList.toggle('zoom',detail);document.querySelector('#gallery-image').alt=`رسم توضيحي تجريبي لـ ${p.name} — ${detail?'تفاصيل العبوة':'الواجهة'}`;document.querySelectorAll('[data-view]').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-pressed',String(t===b));});}));\n updateSEO(p.name,`${p.name} — ${p.notes}. منتج توضيحي من مسكان.`,`/products/${p.id}`,p);\n}\nfunction search() {\n main.innerHTML=`\u003csection class=\"section container search-page\">\u003cp class=\"eyebrow\">اكتشف ما يشبهك\u003c/p>\u003ch1>عن أي عطر تبحث؟\u003c/h1>\u003cform id=\"search-form\" role=\"search\">\u003clabel class=\"sr-only\" for=\"search-input\">اسم العطر أو نفحاته\u003c/label>\u003cinput id=\"search-input\" type=\"search\" placeholder=\"اسم العطر، مسك، عنبر…\" autocomplete=\"off\" maxlength=\"100\">\u003cbutton class=\"button\">ابحث\u003c/button>\u003c/form>\u003cp id=\"search-count\" role=\"status\" aria-live=\"polite\">اكتب اسم العطر أو نفحاته لاكتشاف النتائج.\u003c/p>\u003cdiv id=\"search-results\">\u003c/div>\u003c/section>`;\n function refresh(){const q=document.querySelector('#search-input').value.trim().toLocaleLowerCase('ar');const list=products.filter(p=>`${p.name} ${p.latin} ${p.notes}`.toLocaleLowerCase('ar').includes(q));document.querySelector('#search-count').textContent=q?`${list.length} نتائج للبحث عن «${q}»`:'جميع المنتجات التجريبية';document.querySelector('#search-results').innerHTML=list.length?grid(list):'\u003cdiv class=\"empty\">\u003ch2>لم نعثر على عطر بهذا الاسم\u003c/h2>\u003cp>جرّب نفحة أخرى مثل المسك أو الورد.\u003c/p>\u003ca class=\"text-link\" href=\"#/collection/all\">تصفح المجموعة ←\u003c/a>\u003c/div>';}\n document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();refresh();});document.querySelector('#search-input').addEventListener('input',refresh);updateSEO('البحث','ابحث في مجموعة مسكان التجريبية.','/search');\n}\nfunction infoPage(type) {\n const pages={shipping:['التوصيل والدفع','تُحدّد رسوم التوصيل والمناطق المغطاة والمدد وشروط الدفع عند الاستلام بعد مراجعة فريق مسكان. رسالة العرض المخطط لها: التوصيل بالمجان لمشتريات بقيمة 500 درهم أو أكثر. لا تُعتمد هذه الصفحة كسياسة نهائية.'],returns:['الاستبدال والإرجاع','تُضاف شروط الإرجاع والاستبدال والآجال والمنتجات المستثناة بعد اعتماد سياسة المتجر ومراجعتها. لا توجد سياسة تجارية نافذة في هذا النموذج.'],privacy:['سياسة الخصوصية','هذه النسخة لا تتضمن أدوات تتبّع أو نماذج ترسل بيانات شخصية. تُحفظ عناصر السلة التجريبية في التخزين المحلي لهذا المتصفح، ويمكن حذفها بإفراغ السلة أو مسح بيانات الموقع. تُضاف سياسة المتجر النهائية قبل ربط YouCan وأدواته.']};\n const [title,copy]=pages[type]||[];if(!title)return notFound();main.innerHTML=`\u003csection class=\"section container prose\">\u003cp class=\"eyebrow\">معلومات المتجر\u003c/p>\u003ch1>${title}\u003c/h1>\u003cp class=\"demo-note\">صفحة توضيحية — تتطلب محتوى معتمداً قبل الإطلاق.\u003c/p>\u003cp>${copy}\u003c/p>\u003ca class=\"text-link\" href=\"#/contact\">اتصل بنا ←\u003c/a>\u003c/section>`;updateSEO(title,copy,`/policies/${type}`);\n}\nfunction contact(){main.innerHTML=`\u003csection class=\"section container prose\">\u003cp class=\"eyebrow\">MUSKANE PARFUM\u003c/p>\u003ch1>يسعدنا تواصلك.\u003c/h1>\u003cp>للمساعدة في اختيار عطر أو للاستفسار عن طلبك، ستجد هنا قنوات التواصل الرسمية عند تفعيل المتجر.\u003c/p>\u003cdiv id=\"contact-channels\">\u003c/div>\u003cp class=\"demo-note\">لم تُزوّد النسخة التجريبية برقم هاتف أو حسابات اجتماعية. لا تستقبل هذه الصفحة رسائل أو طلبات.\u003c/p>\u003ca class=\"button\" href=\"#/collection/all\">اكتشف المجموعة ←\u003c/a>\u003c/section>`;const target=document.querySelector('#contact-channels');if(config.contactEmail&&/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(config.contactEmail)){const a=document.createElement('a');a.href=`mailto:${config.contactEmail}`;a.textContent=config.contactEmail;target.append(a);}updateSEO('اتصل بنا','قنوات التواصل الرسمية لمسكان — تُضاف بعد تأكيدها.','/contact');}\nfunction notFound(){main.innerHTML='\u003csection class=\"section container empty\">\u003ch1>الصفحة غير موجودة\u003c/h1>\u003cp>يمكنك العودة لاكتشاف مجموعة مسكان.\u003c/p>\u003ca class=\"button\" href=\"#/\">الصفحة الرئيسية\u003c/a>\u003c/section>';updateSEO('الصفحة غير موجودة','العودة إلى متجر مسكان.','/404');}\nfunction route(){const version=++routeVersion;const path=location.hash.slice(1)||'/';const parts=path.split('/').filter(Boolean);document.body.classList.toggle('is-product',parts[0]==='product');document.querySelector('#mobile-nav').hidden=true;document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');if(!parts.length)home();else if(parts[0]==='collection')collection(parts[1],version);else if(parts[0]==='product')product(parts[1]);else if(parts[0]==='search')search();else if(parts[0]==='policy')infoPage(parts[1]);else if(parts[0]==='contact')contact();else notFound();document.querySelectorAll('.desktop-nav a').forEach(a=>{if(a.hash===location.hash||(!location.hash&&a.hash==='#/'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});window.scrollTo({top:0,behavior:'instant'});if(version>1)main.focus({preventScroll:true});}\nfunction toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3000);}\nfunction save(){try{localStorage.setItem('muskane-demo-cart',JSON.stringify(cart));}catch{/* Memory cart remains usable. */}document.querySelector('#cart-count').textContent=cart.reduce((sum,i)=>sum+i.quantity,0);}\nasync function add(id,quantity=1){if(!products.some(p=>p.id===id)||!Number.isInteger(quantity)||quantity\u003c1||quantity>20)return;cart=await commerce.addItem(id,quantity,cart);save();toast('تمت الإضافة إلى السلة التجريبية');if(dialog.open)renderCart();}\nfunction renderCart(){const subtotal=cart.reduce((sum,i)=>sum+products.find(p=>p.id===i.id).price*i.quantity,0);document.querySelector('#cart-items').innerHTML=cart.length?cart.map(i=>{const p=products.find(p=>p.id===i.id);return `\u003carticle class=\"cart-item\">\u003ca href=\"#/product/${p.id}\" class=\"${p.tone}\">\u003cimg src=\"${previewAsset(`./assets/${p.pack?'pack':'bottle'}.svg`)}\" alt=\"${p.name} — رسم توضيحي\" width=\"80\" height=\"96\">\u003c/a>\u003cdiv>\u003ch3>${p.name}\u003c/h3>\u003cp>\u003cbdi dir=\"ltr\">${money(p.price)}\u003c/bdi>\u003c/p>\u003cdiv class=\"cart-quantity\">\u003cbutton data-cart-step=\"-1\" data-id=\"${p.id}\" aria-label=\"تقليل كمية ${p.name}\" ${i.quantity===1?'disabled':''}>−\u003c/button>\u003cspan>${i.quantity}\u003c/span>\u003cbutton data-cart-step=\"1\" data-id=\"${p.id}\" aria-label=\"زيادة كمية ${p.name}\" ${i.quantity===20?'disabled':''}>+\u003c/button>\u003cbutton data-remove=\"${p.id}\">حذف\u003c/button>\u003c/div>\u003c/div>\u003c/article>`;}).join(''):'\u003cdiv class=\"empty\">\u003ch3>سلتك تنتظر اكتشافاتك\u003c/h3>\u003cp>ابدأ باختيار عطر من المجموعة.\u003c/p>\u003ca href=\"#/collection/all\" class=\"text-link\">تصفّح العطور ←\u003c/a>\u003c/div>';document.querySelector('#cart-summary').innerHTML=cart.length?`\u003cdiv class=\"subtotal\">\u003cspan>المجموع الفرعي\u003c/span>\u003cb>\u003cbdi dir=\"ltr\">${money(subtotal)}\u003c/bdi>\u003c/b>\u003c/div>\u003cp class=\"muted\">رسوم التوصيل وشروط الدفع تُضاف بعد اعتماد سياسات المتجر.\u003c/p>\u003cbutton class=\"button full\" disabled>إتمام الطلب غير متاح في المعاينة\u003c/button>\u003cp class=\"demo-label\">لا يمكن الدفع أو إرسال طلب في هذا النموذج.\u003c/p>\u003cbutton class=\"text-link\" id=\"clear-cart\">إفراغ السلة\u003c/button>`:'';document.querySelector('#clear-cart')?.addEventListener('click',()=>{cart=[];save();renderCart();document.querySelector('#close-cart').focus();});}\ndocument.addEventListener('click',e=>{const addButton=e.target.closest('[data-add]');if(addButton)add(addButton.dataset.add);const remove=e.target.closest('[data-remove]');if(remove){cart=cart.filter(i=>i.id!==remove.dataset.remove);save();renderCart();(document.querySelector('[data-remove]')||document.querySelector('#close-cart')).focus();}const step=e.target.closest('[data-cart-step]');if(step){const item=cart.find(i=>i.id===step.dataset.id);if(item)item.quantity=Math.max(1,Math.
